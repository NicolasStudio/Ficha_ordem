<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nicolas de Almeida Sousa">
    <meta name="description" content="Ficha de RPG Ordem Paranormal, Nicolas de Almeida Sousa">
    <title>Ficha Ordem Paranormal</title>


    <!-- Tema de cores (antes dos outros estilos) -->
    <script src="Js/scriptTemaInicial.js"></script>
    <link rel="stylesheet" href="CSS/styleTema.css">

    <!-- Estilos -->
    <link rel="stylesheet" href="CSS/stylePadrao.css"> <!-- Básico -->
    <link rel="stylesheet" href="CSS/styleModal.css"> <!-- avisos -->

    <!-- Script -->
    <script src="Js/scriptPadrao.js"></script>

</head>
<body>
<!-- Recuperação de senha -->
<div class="containerInitial">

    <div class="boxRecuperar" id="boxRecuperar">
        <h2>Recuperar senha</h2>

        <label for="emailCad">Email: </label>
        <input type="email" id="emailCad" required>

        <button id="btnEnviar">Enviar e-mail</button>
        <button class="btnShowLogin" onclick="irLogin2()">Voltar</button>
    </div>
</div>

<script type="module">
    import { auth } from "./Js/scriptFirebase.js";
    import { avisar, avisarNaProximaPagina } from "./Js/scriptModal.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // O Firebase envia um e-mail com o link para criar uma nova senha
    document.getElementById('btnEnviar').addEventListener('click', async () => {
        const email = document.getElementById('emailCad').value;

        if (!email) {
            avisar("Informe o seu e-mail.", 'erro');
            return;
        }

        try {
            await sendPasswordResetEmail(auth, email);
            avisarNaProximaPagina("Se este e-mail estiver cadastrado, você receberá um link para alterar a senha.");
            window.location.href = 'index.html';
        } catch (error) {
            console.error(error);
            avisar("E-mail inválido.", 'erro');
        }
    });
</script>

</body>
</html>
