<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nicolas de Almeida Sousa">
    <meta name="description" content="Ficha de RPG Ordem Paranormal, Nicolas de Almeida Sousa">
    <title>Ficha Ordem Paranormal</title>
    <link rel="icon" type="image/svg+xml" href="Img/favicon.svg">

    <!-- Tema de cores (antes dos outros estilos) -->
    <script src="Js/scriptTemaInicial.js"></script>
    <link rel="stylesheet" href="CSS/styleTema.css">

    <!-- Estilos -->
    <link rel="stylesheet" href="CSS/stylePadrao.css"> <!-- Básico -->
    <link rel="stylesheet" href="CSS/styleSair.css"> <!-- menu ☰ -->
    <link rel="stylesheet" href="CSS/styleModal.css"> <!-- avisos e confirmação -->
    <link rel="stylesheet" href="CSS/styleMestre.css"> <!-- área do mestre -->
    <link rel="stylesheet" href="CSS/styleFiltro.css"> <!-- funil de filtro da lista -->
</head>
<body style="visibility: hidden"> <!-- aparece depois de confirmar que é o mestre -->
    <div class="boxSair"></div> <!-- menu ☰ (Js/scriptMenu.js) -->
    <div class="containerFichas">
        <img class="imgLogoMenu" src="Img/imgMenu/monstro.png" width="188" height="160" alt="" />
        <h1 class="tituloPagina">Fichas das criaturas</h1>

        <div class="boxTitle boxTitleFiltro">
            <div class="ficha-titulo2 colunasCriaturas">
                <span>Criatura</span>
                <span>Elementos</span>
                <span>PV</span>
                <span>PE</span>
                <span>
                    <button type="button" class="botaoFiltro" id="botaoFiltro" title="Filtrar criaturas"
                        aria-label="Filtrar criaturas" aria-expanded="false" aria-controls="painelFiltro">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M3 5h18l-7 8.5V19l-4 2v-7.5L3 5z" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </button>
                </span>
            </div>

            <!-- Filtro por nome e elementos (fica só na tela, não é salvo) -->
            <div class="painelFiltro" id="painelFiltro" hidden>
                <label class="rotuloFiltro" for="filtroNome">Nome</label>
                <input type="text" id="filtroNome" class="campoFiltro" placeholder="Buscar criatura..." autocomplete="off">
                <p class="rotuloFiltro">Elementos</p>
                <div class="elementosFiltro" id="elementosFiltro"></div>
                <button type="button" class="limparFiltro" id="limparFiltro">Limpar filtros</button>
            </div>
        </div>

        <!-- Criaturas do mestre -->
        <div class="boxFichas"></div>

        <!-- Nova criatura -->
        <div class="imgWrapper">
            <img src="Img/add.png" alt="Nova criatura" title="Nova criatura" onclick="window.location.href = 'criatura.html'" />
        </div>
    </div>

    <script type="module">
        import { db } from "./Js/scriptFirebase.js";
        import { exigirMestre } from "./Js/mestres.js";
        import { confirmarModal, avisar } from "./Js/scriptModal.js";
        import { collection, query, where, getDocs, doc, deleteDoc }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const mestre = await exigirMestre();
        document.body.style.visibility = '';

        function criarSpan(classe, texto) {
            const span = document.createElement('span');
            span.className = classe;
            span.textContent = texto ?? '';
            return span;
        }

        function mensagem(texto) {
            document.querySelector('.boxFichas').innerHTML =
                `<center><p style='color: var(--color-white); margin-top: 30px'>${texto}</p></center>`;
        }

        // "12 / 30", ou vazio se não preenchido
        const pontos = (atual, total) => (atual || total) ? `${atual || '–'} / ${total || '–'}` : '';

        // ---------- Filtro ----------
        const ELEMENTOS = ['Sangue', 'Morte', 'Conhecimento', 'Energia', 'Medo'];
        const botaoFiltro = document.getElementById('botaoFiltro');
        const painelFiltro = document.getElementById('painelFiltro');
        const filtroNome = document.getElementById('filtroNome');
        const elementosFiltro = document.getElementById('elementosFiltro');
        const elementosMarcados = new Set();
        let criaturas = [];

        // compara sem maiúsculas e sem acentos: "recem" encontra "Recém"
        const normalizar = texto => (texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

        for (const elemento of ELEMENTOS) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chipElemento';
            chip.textContent = elemento;
            chip.setAttribute('aria-pressed', 'false');
            chip.addEventListener('click', () => {
                if (elementosMarcados.has(elemento)) elementosMarcados.delete(elemento);
                else elementosMarcados.add(elemento);
                chip.setAttribute('aria-pressed', String(elementosMarcados.has(elemento)));
                mostrarCriaturas();
            });
            elementosFiltro.appendChild(chip);
        }

        function abrirFiltro(abrir) {
            painelFiltro.hidden = !abrir;
            botaoFiltro.setAttribute('aria-expanded', String(abrir));
            if (abrir) filtroNome.focus();
        }

        botaoFiltro.addEventListener('click', () => abrirFiltro(painelFiltro.hidden));
        filtroNome.addEventListener('input', mostrarCriaturas);
        document.getElementById('limparFiltro').addEventListener('click', () => {
            filtroNome.value = '';
            elementosMarcados.clear();
            elementosFiltro.querySelectorAll('.chipElemento').forEach(chip => chip.setAttribute('aria-pressed', 'false'));
            mostrarCriaturas();
            filtroNome.focus();
        });
        // fecha com Esc ou clicando fora do painel
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !painelFiltro.hidden) { abrirFiltro(false); botaoFiltro.focus(); }
        });
        document.addEventListener('click', event => {
            if (!painelFiltro.hidden && !painelFiltro.contains(event.target) && !botaoFiltro.contains(event.target)) abrirFiltro(false);
        });

        // Nome: contém o texto. Elementos: a criatura tem pelo menos um dos marcados
        // (como principal ou secundário).
        function passaNoFiltro(criatura) {
            const busca = normalizar(filtroNome.value.trim());
            if (busca && !normalizar(criatura.nomeCriatura).includes(busca)) return false;
            if (elementosMarcados.size === 0) return true;
            return elementosMarcados.has(criatura.elementoPrincipal) || elementosMarcados.has(criatura.elementoSecundario);
        }

        async function carregarCriaturas() {
            let snap;
            try {
                snap = await getDocs(query(collection(db, 'criaturas'), where('uid', '==', mestre.uid)));
            } catch (error) {
                console.error(error);
                mensagem('Não foi possível carregar as criaturas. Recarregue a página.');
                return;
            }

            criaturas = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (a.nomeCriatura || '').localeCompare(b.nomeCriatura || '', 'pt-BR'));

            if (criaturas.length === 0) {
                mensagem('Você ainda não tem criaturas cadastradas.');
                return;
            }
            mostrarCriaturas();
        }

        function mostrarCriaturas() {
            const filtroAtivo = filtroNome.value.trim() !== '' || elementosMarcados.size > 0;
            botaoFiltro.classList.toggle('ativo', filtroAtivo);
            if (criaturas.length === 0) return; // ainda carregando, ou sem criaturas

            const visiveis = criaturas.filter(passaNoFiltro);
            if (visiveis.length === 0) {
                mensagem('Nenhuma criatura encontrada com esses filtros.');
                return;
            }

            const box = document.querySelector('.boxFichas');
            box.innerHTML = '';
            for (const criatura of visiveis) {
                const div = document.createElement('div');
                div.className = 'ficha colunasCriaturas';
                div.style.cursor = 'pointer';
                div.onclick = () => window.location.href = 'criatura.html?id=' + encodeURIComponent(criatura.id);

                const elementos = [criatura.elementoPrincipal, criatura.elementoSecundario].filter(Boolean).join(' / ');
                div.append(
                    criarSpan('nomePersonagem', criatura.nomeCriatura || 'Sem nome'),
                    criarSpan('elementoCriatura', elementos),
                    criarSpan('pontosCriatura', pontos(criatura.pv_atual, criatura.pv_total)),
                    criarSpan('pontosCriatura', pontos(criatura.pe_atual, criatura.pe_total))
                );

                // Excluir pela lista
                const botao = document.createElement('button');
                botao.className = 'excluirLinha';
                botao.textContent = 'X';
                botao.title = 'Excluir criatura';
                botao.addEventListener('click', async event => {
                    event.stopPropagation(); // não abre a criatura ao clicar no X
                    if (!await confirmarModal('Deseja realmente excluir esta criatura?', 'Essa ação não pode ser desfeita.')) return;
                    try {
                        await deleteDoc(doc(db, 'criaturas', criatura.id));
                        avisar('Criatura excluída com sucesso!');
                        carregarCriaturas();
                    } catch (error) {
                        console.error(error);
                        avisar('Ocorreu um erro ao excluir a criatura.', 'erro');
                    }
                });
                const spanBotao = document.createElement('span');
                spanBotao.appendChild(botao);
                div.appendChild(spanBotao);

                box.appendChild(div);
            }
        }

        carregarCriaturas();
    </script>
    <script src="Js/scriptMenu.js" type="module"></script>
</body>
</html>
