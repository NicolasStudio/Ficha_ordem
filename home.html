<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nicolas de Almeida Sousa">
    <meta name="description" content="Ficha de RPG Ordem Paranormal, Nicolas de Almeida Sousa">
    <title>Ficha Ordem Paranormal</title>
    <link rel="icon" type="image/svg+xml" href="Img/favicon.svg">

    <!-- Tema de cores (antes dos outros estilos) -->
    <script src="Js/scriptTemaInicial.js"></script>
    <link rel="stylesheet" href="CSS/styleTema.css">

    <!-- Estilos -->
    <link rel="stylesheet" href="CSS/stylePadrao.css"> <!-- Básico -->
    <link rel="stylesheet" href="CSS/styleSair.css"> <!-- sair -->
    <link rel="stylesheet" href="CSS/styleModal.css"> <!-- modal de confirmação -->
    <link rel="stylesheet" href="CSS/styleFiltro.css"> <!-- funil de filtro da lista -->
    <link rel="stylesheet" href="CSS/styleAutoComplete.css"> <!-- sugestões dos campos do filtro -->
    <!-- Scripts -->
    <script src="Js/scriptPadrao.js"></script>
</head>
<body>
    <div class="boxSair"></div> <!-- menu ☰ (Js/scriptMenu.js) -->
    <div class="containerFichas">
        <img class="imgLogoMenu" src="Img/imgMenu/personagem.png" width="158" height="160" alt="" />
        <h1 class="tituloPagina">Suas fichas</h1>

        <!-- Título das fichas -->
        <div class="boxTitle boxTitleFiltro">
            <div class="ficha-titulo2">
                <span>Nome</span>
                <span>Nível de NEX</span>
                <span>Origem</span>
                <span>Classe</span>
                <span>
                    <button type="button" class="botaoFiltro" id="botaoFiltro" title="Filtrar fichas"
                        aria-label="Filtrar fichas" aria-expanded="false" aria-controls="painelFiltro">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M3 5h18l-7 8.5V19l-4 2v-7.5L3 5z" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </button>
                </span>
            </div>

            <!-- Filtro com auto-complete (campos criados pelo Js/scriptFiltroFichas.js) -->
            <div class="painelFiltro" id="painelFiltro" hidden></div>
        </div>

        <!-- Fichas puxadas do servidor -->
        <div class="boxFichas"></div>

        <!-- Botão de adicionar nova ficha -->
        <div class="imgWrapper">
            <img src="Img/add.png" alt="Ícone" onclick="criarFicha()" />
        </div>
    </div>

    <script type="module">
        import { db, exigirLogin } from "./Js/scriptFirebase.js";
        import { confirmarModal, avisar } from "./Js/scriptModal.js";
        import { criarFiltro, nexDaFicha } from "./Js/scriptFiltroFichas.js";
        import { collection, query, where, getDocs, doc, deleteDoc }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const usuario = await exigirLogin();

        function criarSpan(classe, texto) {
            const span = document.createElement('span');
            span.className = classe;
            span.textContent = texto ?? '';
            return span;
        }

        // Filtro (funil no título): sugestões tiradas das suas fichas
        let fichas = [];
        const filtro = criarFiltro({
            campos: [
                { rotulo: 'Nome', placeholder: 'Buscar personagem...', valor: ficha => ficha.nomePersonagem },
                { rotulo: 'Nível de NEX', placeholder: 'Ex.: 25%', valor: nexDaFicha, numero: true },
                { rotulo: 'Origem', placeholder: 'Buscar origem...', valor: ficha => ficha.origem },
                { rotulo: 'Classe', placeholder: 'Buscar classe...', valor: ficha => ficha.classe },
            ],
            aoMudar: mostrarFichas,
        });

        async function carregarFichas() {
            const box = document.querySelector('.boxFichas');

            // Só as fichas do usuário logado
            let snap;
            try {
                snap = await getDocs(query(collection(db, 'fichas'), where('uid', '==', usuario.uid)));
            } catch (error) {
                console.error(error);
                box.innerHTML = "<center><p style='color: var(--color-white); margin-top: 30px'>Não foi possível carregar as fichas. Recarregue a página.</p></center>";
                return;
            }

            // O Firestore não garante ordem: ordena pelo nome do personagem
            fichas = snap.docs
                .map(d => ({ id_ficha: d.id, ...d.data() }))
                .sort((a, b) => (a.nomePersonagem || '').localeCompare(b.nomePersonagem || '', 'pt-BR'));

            box.innerHTML = '';

            if (fichas.length === 0) {
                box.innerHTML = "<center><p style='color: var(--color-white); margin-top: 30px'>Você ainda não tem fichas cadastradas. </p></center>";
                return;
            }
            filtro.prepararSugestoes(fichas);
            mostrarFichas();
        }

        function mostrarFichas() {
            if (fichas.length === 0) return; // ainda carregando, ou sem fichas

            const box = document.querySelector('.boxFichas');
            const visiveis = fichas.filter(filtro.passa);
            if (visiveis.length === 0) {
                box.innerHTML = "<center><p style='color: var(--color-white); margin-top: 30px'>Nenhuma ficha encontrada com esses filtros.</p></center>";
                return;
            }

            box.innerHTML = '';
            visiveis.forEach(ficha => {
                const div = document.createElement('div');
                div.className = 'ficha';
                div.style.cursor = 'pointer';
                div.onclick = () => window.location.href = 'ficha.html?id=' + encodeURIComponent(ficha.id_ficha);

                div.appendChild(criarSpan('nomePersonagem', ficha.nomePersonagem));
                div.appendChild(criarSpan('nextPersonagem', nexDaFicha(ficha)));
                div.appendChild(criarSpan('origemPersonagem', ficha.origem));
                div.appendChild(criarSpan('classePersonagem', ficha.classe));

                // Botão de excluir
                const botao = document.createElement('button');
                botao.className = 'excluirLinha';
                botao.textContent = 'X';
                botao.addEventListener('click', async (event) => {
                    event.stopPropagation(); // não abre a ficha ao clicar no X

                    if (await confirmarModal('Deseja realmente excluir esta ficha?', 'Essa ação não pode ser desfeita.')) {
                        try {
                            await deleteDoc(doc(db, 'fichas', ficha.id_ficha));
                            avisar('Ficha excluída com sucesso!');
                            carregarFichas();
                        } catch (error) {
                            console.error(error);
                            avisar('Ocorreu um erro ao excluir a ficha.', 'erro');
                        }
                    }
                });
                const spanBotao = document.createElement('span');
                spanBotao.appendChild(botao);
                div.appendChild(spanBotao);

                box.appendChild(div);
            });
        }

        carregarFichas();
    </script>
    <script src="Js/scriptMenu.js" type="module"></script>
</body>
</html>
